[project]
name = "pr-review-loop"
version = "0.0.0"
description = "Skill repository; pyproject exists only to declare dev tooling."
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "pyyaml",
    "jsonschema",
    "cogapp",
    "ruff",
    "yamllint",
    "pre-commit",
    "pytest",
]

[tool.ruff]
# held below requires-python: at py314 the formatter writes `except A, B:`,
# which older interpreters cannot parse and the skill does not refuse
target-version = "py312"
line-length = 100
extend-include = ["scripts/*.py"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
]

[tool.pytest.ini_options]
# retained evidence holds copies of these tests, and reviewer fixtures fail by
# design; either breaks collection
addopts = "--ignore=docs/superpowers --ignore=tests/fixtures"
