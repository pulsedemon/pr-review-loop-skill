# Source of truth for reviewer panel composition.
#
# Every other surface (SKILL.md persona list, SKILL.md §4b move bullets,
# output.schema.json reviewer enum, scenario panel-count phrases, persona-file
# panel-count phrases, the Move C drift-guarded files) is asserted to
# match this file.
#
# Workflow when adding, removing, or reordering a persona:
#   1. Edit this file (panel: list and/or adversary:). Each entry needs
#      name, file (must equal `<name>.md`), and a one-line description.
#   2. run scripts/regen.sh to regenerate the SKILL.md
#      "Reviewer personas" bullet list and the reviewers/output.schema.json
#      `reviewer` enum.
#   3. Run bash tests/run.sh. Any remaining failures will name surfaces the
#      generator does not manage (the reviewers/<name>.md file itself,
#      per-persona move bodies, prose tuned per domain). those still
#      need a manual fix.
#
# Ordering of `panel` is the canonical order used by tests and by the
# SKILL.md "Reviewer personas" bullet list. Reorder thoughtfully.

panel:
  - name: correctness
    file: correctness.md
    description: "logic bugs, edge cases, error handling"
    move_a: true
    move_a1: false
    move_b: true
    move_c: false
  - name: tests
    file: tests.md
    description: "coverage of changed code, missing test cases"
    move_a: true
    move_a1: true
    move_b: true
    move_c: false
  - name: security
    file: security.md
    description: "injection, auth, secrets, unsafe deserialization"
    move_a: false
    move_a1: false
    move_b: true
    move_c: false
  - name: performance
    file: performance.md
    description: "complexity regressions, N+1, unbounded loops"
    move_a: false
    move_a1: false
    move_b: false
    move_c: false
  - name: readability
    file: readability.md
    description: "naming, cohesion, obvious dead code (scope-strict)"
    move_a: false
    move_a1: false
    move_b: false
    move_c: true
  - name: yagni
    file: yagni.md
    description: >-
      YAGNI: unused behavior, redundant responsibilities, or violated
      requirements in abstractions introduced by the PR. Traces surrounding
      callers and referenced sibling PRs. Single use alone is not a finding.
    move_a: false
    move_a1: false
    move_b: false
    move_c: false
  - name: requirements
    file: requirements.md
    description: "reads linked ticket, checks each stated requirement"
    move_a: false
    move_a1: false
    move_b: false
    move_c: true
  - name: comments
    file: comments.md
    description: >-
      comment accuracy and rot on PR-changed comments only (load-bearing
      doc-comment drift). Default severity `suggestion`; promotes to
      `blocker` only when a documented invariant/contract is violated.
      Quotes the offending comment text and the contradicting code.
    move_a: false
    move_a1: false
    move_b: false
    move_c: true
  - name: error_handling
    file: error_handling.md
    description: >-
      silent failures introduced by the PR (bare catches that continue,
      fallback-to-mock on production paths, discarded errors, overly
      broad catches hiding unrelated errors). Default `blocker` for hard
      signals; `suggestion` for weak log context / missing repo-specific
      error IDs. Lists which error types each catch could hide.
    move_a: false
    move_a1: false
    move_b: true
    move_c: false
  - name: type_design
    file: type_design.md
    description: >-
      type-design invariants on types the PR adds or modifies
      (applicability-gated: returns immediately if the diff has no type
      definitions). Default `suggestion`; promotes to `blocker` only when
      an illegal state is both trivially representable AND reachable from
      the diff. Translates encapsulation/invariant/usefulness/enforcement
      judgments into prose `detail`.
    move_a: false
    move_a1: false
    move_b: false
    move_c: false
    owns_schema_constraint_blocker: true
  - name: blind_spots
    file: blind_spots.md
    description: >-
      gap-filler for three categories the panel under-covers: (a)
      concurrency / ordering hazards in new async code or shared-state
      access; (b) failure paths with neither test nor handler, and
      validators that report success when they could not run; (c) new env
      vars, feature flags, or external service calls without bounds,
      timeouts, or fallbacks. Scope-strict; participates in multi-source
      promotion.
    move_a: true
    move_a1: false
    move_b: true
    move_c: true

adversary:
  name: adversary
  file: adversary.md
  description: >-
    separate second-pass reviewer, **not** part of the §4b parallel panel.
    Invoked from §4d.0 (after the panel synthesizes) on the approval path
    and, when shallow reviews are detected, on the change-applying path
    up to the `shallow_adversary_runs` cap. Uses the same JSON schema as
    panel personas with `reviewer: "adversary"`.

addendums:
  # Files in reviewers/ that are read by personas but are NOT personas
  # themselves. The enum-sync test excludes them from the persona-set check.
  - _human_comments_addendum.md
  - _working_tree_addendum.md
